version: '3.8'

services:
  # Test PostgreSQL database
  postgres-test:
    image: postgres:15-alpine
    container_name: docker-auto-postgres-test
    environment:
      POSTGRES_DB: docker_auto_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d docker_auto_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Test Redis cache
  redis-test:
    image: redis:7-alpine
    container_name: docker-auto-redis-test
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend application for integration testing
  app-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: docker-auto-app-test
    environment:
      # Database configuration
      DB_TYPE: postgres
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_NAME: docker_auto_test

      # Redis configuration
      REDIS_URL: redis://redis-test:6379

      # Docker configuration
      DOCKER_HOST: unix:///var/run/docker.sock

      # Application configuration
      PORT: 8080
      JWT_SECRET: test-jwt-secret-key-for-testing-only
      LOG_LEVEL: debug

      # Feature flags for testing
      ENABLE_METRICS: true
      ENABLE_WEBSOCKET: true
      ENABLE_TERMINAL: true

      # Test-specific settings
      TEST_MODE: true
      AUTO_MIGRATE: true
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/app/logs
      - test_data:/app/data
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test runner container
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: docker-auto-test-runner
    environment:
      # Test configuration
      TEST_DB_HOST: postgres-test
      TEST_DB_PORT: 5432
      TEST_DB_USER: testuser
      TEST_DB_PASSWORD: testpass
      TEST_DB_NAME: docker_auto_test
      TEST_REDIS_URL: redis://redis-test:6379
      TEST_APP_URL: http://app-test:8080

      # Docker configuration for testing
      DOCKER_HOST: unix:///var/run/docker.sock

      # Test execution settings
      GO_TEST_TIMEOUT: 300s
      SKIP_INTEGRATION: ${SKIP_INTEGRATION:-false}
      SKIP_E2E: ${SKIP_E2E:-false}
      PERFORMANCE_TESTS: ${PERFORMANCE_TESTS:-false}
      VERBOSE: ${VERBOSE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./test-reports:/app/test-reports
      - .:/app/src
    networks:
      - test-network
    depends_on:
      app-test:
        condition: service_healthy
    profiles:
      - testing
    command: ["./scripts/run-tests.sh", "${TEST_TYPE:-all}"]

  # Load testing with K6
  load-test:
    image: grafana/k6:latest
    container_name: docker-auto-load-test
    environment:
      K6_PROMETHEUS_RW_ENDPOINT: http://prometheus:9090/api/v1/write
    volumes:
      - ./tests/load:/scripts
      - ./test-reports:/reports
    networks:
      - test-network
    depends_on:
      app-test:
        condition: service_healthy
    profiles:
      - load-testing
    command: ["run", "/scripts/container-operations.js", "--out", "json=/reports/load-test-results.json"]

  # Monitoring stack for performance testing
  prometheus:
    image: prom/prometheus:latest
    container_name: docker-auto-prometheus-test
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus-test.yml:/etc/prometheus/prometheus.yml
      - prometheus_test_data:/prometheus
    networks:
      - test-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: docker-auto-grafana-test
    environment:
      GF_SECURITY_ADMIN_PASSWORD: testpass
    ports:
      - "3001:3000"
    volumes:
      - grafana_test_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - test-network
    profiles:
      - monitoring

  # Database migration service for testing
  migrate:
    image: migrate/migrate
    container_name: docker-auto-migrate-test
    volumes:
      - ./database/migrations:/migrations
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles:
      - migration
    command: [
      "-path", "/migrations",
      "-database", "postgres://testuser:testpass@postgres-test:5432/docker_auto_test?sslmode=disable",
      "up"
    ]

  # Test data seeder
  seed-data:
    build:
      context: ./scripts
      dockerfile: Dockerfile.seed
    container_name: docker-auto-seed-test
    environment:
      DATABASE_URL: postgres://testuser:testpass@postgres-test:5432/docker_auto_test?sslmode=disable
      REDIS_URL: redis://redis-test:6379
    volumes:
      - ./scripts/seed:/scripts
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    profiles:
      - seeding
    command: ["./seed-test-data.sh"]

volumes:
  postgres_test_data:
    driver: local
  redis_test_data:
    driver: local
  test_data:
    driver: local
  prometheus_test_data:
    driver: local
  grafana_test_data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# Test-specific configurations
configs:
  test-config:
    file: ./config/test.yml

secrets:
  test-jwt-secret:
    file: ./secrets/test-jwt-secret.txt